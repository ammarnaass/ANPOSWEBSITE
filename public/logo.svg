<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="anGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Blue circular swoosh -->
  <path d="M 330 105 A 150 150 0 1 0 330 407" fill="none" stroke="url(#swoosh)" stroke-width="26" stroke-linecap="round"/>

  <!-- Phone -->
  <g>
    <rect x="196" y="88" width="150" height="264" rx="30" fill="none" stroke="#ffffff" stroke-width="17" transform="rotate(8 271 220)"/>
    <rect x="243" y="106" width="44" height="10" rx="5" fill="#ffffff" transform="rotate(8 271 220)"/>
    <rect x="248" y="330" width="40" height="9" rx="4.5" fill="#ffffff" transform="rotate(8 271 220)"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#3b82f6" stroke-width="17" stroke-linecap="round">
    <line x1="112" y1="205" x2="168" y2="205"/>
    <line x1="98"  y1="238" x2="150" y2="238"/>
    <line x1="112" y1="271" x2="168" y2="271"/>
  </g>

  <!-- Shopping cart -->
  <g transform="translate(28, 22)" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 210 168 L 342 168 L 322 252 L 232 252 Z"/>
    <path d="M 210 168 L 196 150"/>
    <circle cx="245" cy="285" r="13" fill="#ffffff" stroke="none"/>
    <circle cx="305" cy="285" r="13" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <text x="118" y="432" font-family="Arial Black, Arial, sans-serif" font-size="86" font-style="italic" font-weight="900" fill="url(#anGrad)" letter-spacing="-2">AN</text>
  <text x="268" y="432" font-family="Arial Black, Arial, sans-serif" font-size="86" font-style="italic" font-weight="900" fill="#ffffff" letter-spacing="4">POS</text>

  <!-- Underlines -->
  <rect x="106" y="448" width="98" height="9" rx="4.5" fill="url(#anGrad)"/>
  <rect x="292" y="448" width="118" height="9" rx="4.5" fill="#ffffff"/>
</svg>
